name: free-checks
# Structure, hooks, scanner and fixture checks. No model calls, no API key, no cost.
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI (validator only)
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Free tests — fullstack-ai-dev
        run: bash plugins/fullstack-ai-dev/tests/run-free-tests.sh
